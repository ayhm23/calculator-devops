# fixed project name so Jenkins and a local run manage the same stack
name: calculator

services:
  calculator:
    image: ${DOCKERHUB_USER:?set DOCKERHUB_USER in .env}/calculator:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8080"
      # the JVM reads JAVA_TOOL_OPTIONS itself, so it works with the exec-form ENTRYPOINT
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - calc-net

  nginx:
    image: nginx:1.30.6-alpine3.24
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
        # recreate nginx when calculator is replaced, so it picks up the new container IP
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - calc-net

networks:
  calc-net:
    driver: bridge
